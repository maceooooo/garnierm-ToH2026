<h2>Liste des héros</h2>

<ul class="heroes">
  @for (hero of heroesModel(); track hero.id) {
    <li>
      <a [routerLink]="['/detail', hero.id]">
        <span>{{ hero.id }}</span>&nbsp;
        <span>{{ hero.name }}</span>&nbsp;
        <span [attr.aria-label]="hero.actif ? 'Actif' : 'Inactif'">
          {{ hero.actif ? 'Actif' : 'Inactif' }}
        </span>
      </a>
    </li>
  }
</ul>
