<h2>Liste des héros</h2>

<a class="create-hero-button" routerLink="/heroes/new">Créer un héros +</a>

<!-- L'ID reste dans le lien pour retrouver le document; le nom est l'information lisible pour la personne. -->
<ul class="heroes">
  @for (hero of heroesModel(); track hero.id) {
    <li>
      <a class="hero-view-link" [routerLink]="['/detail', hero.id]">
        <span class="hero-name">{{ hero.name }}</span>
        @if (hero.favori) {
          <span class="hero-favorite" aria-label="Favori" title="Favori">★</span>
        }
      </a>
      <a
        class="hero-edit-link"
        [routerLink]="['/heroes', hero.id, 'edit']"
        [attr.aria-label]="'Modifier ' + hero.name"
        title="Modifier le héros"
      >
        ✎
      </a>
    </li>
  }
</ul>
