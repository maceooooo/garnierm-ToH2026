<h2>Liste des armes</h2>

<a class="create-entity-button create-weapon-button" routerLink="/weapons/new">
  Créer une arme +
</a>

@if (loadError(); as error) {
  <p class="weapon-load-error" role="alert">{{ error }}</p>
}

<ul class="entity-list weapons">
  @for (weapon of weapons(); track weapon.id) {
    <li>
      <a class="entity-view-link weapon-view-link" [routerLink]="['/weapons', weapon.id]">
        <span class="weapon-name">{{ weapon.name }}</span>
      </a>
      <a
        class="entity-edit-link weapon-edit-link"
        [routerLink]="['/weapons', weapon.id, 'edit']"
        [attr.aria-label]="'Modifier ' + weapon.name"
        title="Modifier l’arme"
      >
        ✎
      </a>
    </li>
  }
</ul>
