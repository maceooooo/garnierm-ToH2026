@if (hero(); as selectedHero) {
  <!-- Cette page reste en lecture seule; l'édition a une route dédiée. -->
  <h2>Détails de {{ selectedHero.name }}</h2>
  <div>Identifiant : {{ selectedHero.id }}</div>
  <div>Nom : {{ selectedHero.name }}</div>
  <div>Favori : {{ selectedHero.favori ? 'Oui ★' : 'Non' }}</div>
  <button
    type="button"
    class="navigation-button"
    [routerLink]="['/heroes', selectedHero.id, 'edit']"
  >
    Modifier le héros
  </button>
} @else {
  <!-- L'état vide fournit une sortie claire au lieu d'afficher des détails incomplets. -->
  <h2>Héros introuvable</h2>
  <p>Ce héros n’existe pas dans la liste actuelle.</p>
  <a routerLink="/heroes">Retour à la liste des héros</a>
}
