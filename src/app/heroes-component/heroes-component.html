<div><b>Détails de {{ heroModel().name | uppercase }}</b></div>
<div>id: {{ heroModel().id }}</div>
<div>name: {{ heroModel().name }}</div>
<div>actif: {{ heroModel().actif ? "&check;" : "&#10007;" }}</div>
<div>Input avec signal + événement
  <input [value]="heroModel().name" (input)="changerHeroName($any($event.target).value)">
  <button (click)="changerHeroActif()">Changer le actif</button>
</div>
<div>Input avec form
  <input type="text" [formField]="heroForm.name" />
  <input type="checkbox" [formField]="heroForm.actif" />
</div>
